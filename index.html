<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Копатель - VK Mini App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Экран загрузки -->
        <div id="loading-screen" class="screen active">
            <div class="loading-content">
                <div class="pickaxe-animation">⛏️</div>
                <h1>КОПАТЕЛЬ</h1>
                <p>Загрузка шахты...</p>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
            </div>
        </div>

        <!-- Главный экран игры -->
        <div id="game-screen" class="screen">
            <!-- Шапка -->
            <header class="game-header">
                <div class="player-info">
                    <div class="player-avatar" id="player-avatar">👷</div>
                    <div class="player-stats">
                        <span class="player-name" id="player-name">Игрок</span>
                        <span class="player-level">Уровень <span id="player-level">1</span></span>
                    </div>
                </div>
                <div class="currency">
                    <div class="currency-item">
                        <span class="currency-icon">💰</span>
                        <span id="coins">0</span>
                    </div>
                    <div class="currency-item">
                        <span class="currency-icon">💎</span>
                        <span id="gems">0</span>
                    </div>
                </div>
            </header>

            <!-- Информация о текущей руде -->
            <div class="ore-info">
                <h2>Текущая руда: <span id="current-ore">Угольная</span></h2>
                <div class="ore-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="ore-progress-fill"></div>
                    </div>
                    <span id="ore-progress-text">0 / 50</span>
                </div>
            </div>

            <!-- Зона копания -->
            <div class="mining-area" id="mining-area">
                <div class="ore-display" id="ore-display">
                    <div class="ore-icon">🪨</div>
                    <div class="ore-name">Угольная руда</div>
                </div>
                <button class="mine-button" id="mine-button">
                    <span class="pickaxe-icon">⛏️</span>
                    <span>КОПАТЬ</span>
                    <span class="click-power">+<span id="click-power">1</span></span>
                </button>
                <div class="particles" id="particles"></div>
            </div>

            <!-- Инвентарь -->
            <div class="inventory">
                <h3>Инвентарь</h3>
                <div class="inventory-grid" id="inventory-grid">
                    <!-- Динамически заполняется -->
                </div>
            </div>

            <!-- Нижняя навигация -->
            <nav class="bottom-nav">
                <button class="nav-btn active" data-tab="mine">
                    <span>⛏️</span>
                    <span>Копать</span>
                </button>
                <button class="nav-btn" data-tab="shop">
                    <span>🏪</span>
                    <span>Магазин</span>
                </button>
                <button class="nav-btn" data-tab="upgrades">
                    <span>⬆️</span>
                    <span>Улучшения</span>
                </button>
                <button class="nav-btn" data-tab="achievements">
                    <span>🏆</span>
                    <span>Достижения</span>
                </button>
            </nav>
        </div>

        <!-- Модальные окна -->
        <div id="modal-overlay" class="modal-overlay">
            <div class="modal" id="modal">
                <div class="modal-header">
                    <h2 id="modal-title">Заголовок</h2>
                    <button class="modal-close" id="modal-close">✕</button>
                </div>
                <div class="modal-content" id="modal-content">
                    <!-- Динамический контент -->
                </div>
            </div>
        </div>

        <!-- Уведомления -->
        <div id="notifications" class="notifications"></div>
    </div>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
